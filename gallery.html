<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画廊</title>
  <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <style>
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #111; color: #fff; font: 16px system-ui, sans-serif; }
    body.gallery-actual-size { overflow: auto; }
    .gallery-page { box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; padding: 0; }
    .gallery-page > img { align-self: center; justify-self: center; max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; }
    .gallery-page.gallery-zoomable > img { cursor: zoom-in; }
    .gallery-page.gallery-actual-size { display: block; height: auto; min-height: 100%; padding: 0; }
    .gallery-page.gallery-actual-size > img { display: block; max-width: none; max-height: none; width: auto; height: auto; margin: 0 auto; cursor: zoom-out; }
    .gallery-page nav { position: fixed; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 16px; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; transition: opacity 240ms ease; }
    .gallery-page nav.gallery-controls-visible { opacity: 1; pointer-events: auto; }
    button { padding: 8px 16px; border: 1px solid #777; border-radius: 4px; background: #292929; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .35; cursor: default; }
    .gallery-error { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="gallery-page" class="gallery-page" aria-live="polite">
    <p id="gallery-status">Loading image gallery…</p>
    <img id="gallery-image" hidden alt="">
    <nav id="gallery-controls" hidden aria-label="Gallery navigation">
      <button id="gallery-previous" type="button">上一张</button>
      <span id="gallery-counter"></span>
      <button id="gallery-next" type="button">下一张</button>
    </nav>
  </div>
  <script src="{{ '/assets/gallery.js' | relative_url }}"></script>
</body>
</html>
